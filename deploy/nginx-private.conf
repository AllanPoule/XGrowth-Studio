# nginx : studio accessible uniquement depuis le réseau privé (NetBird, Tailscale…).
# Remplacez 100.x.y.z par l'IP du serveur sur le réseau privé et studio.exemple.fr par votre nom.
# Le certificat s'obtient par défi DNS, par exemple :
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
#     --cert-name xgrowth -d studio.exemple.fr
server {
    listen 100.x.y.z:443 ssl;
    server_name studio.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/xgrowth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xgrowth/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:18790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # la rédaction par l'IA peut prendre plusieurs minutes
        proxy_read_timeout 600s;
    }
}
